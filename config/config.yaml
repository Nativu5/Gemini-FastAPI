# Gemini FastAPI Configuration File

server:
  host: "0.0.0.0" # Server bind address
  port: 8000 # Server port
  api_key: null # API key for authentication (null for no auth)
  # Local transport safety ceiling only; Gemini Web remains authoritative for its actual input limit.
  max_request_body_bytes: 268435456 # 256 MiB; set to 0 to disable the wrapper-side safeguard
  # Regex budget for validating one response against a client-supplied JSON Schema.
  # Exhausting it leaves the reply unverified rather than failing it.
  schema_validation_budget_seconds: 1.0
  https:
    enabled: false # Enable HTTPS
    key_file: "certs/privkey.pem" # SSL private key file path
    cert_file: "certs/fullchain.pem" # SSL certificate file path

cors:
  enabled: true # Enable CORS
  allow_origins: ["*"]
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

gemini:
  clients:
    - id: "client-id-1" # Arbitrary client ID
      secure_1psid: "YOUR_SECURE_1PSID_HERE" # Gemini Secure 1PSID
      secure_1psidts: "YOUR_SECURE_1PSIDTS_HERE" # Gemini Secure 1PSIDTS
      proxy: null # Optional proxy URL (null/empty means direct connection)
      impersonate: null # Optional browser impersonation target (null uses library default)
  timeout: 450 # Request timeout in seconds (Not less than 30s)
  watchdog_timeout: 120 # Watchdog timeout in seconds (Not less than 30s)
  auto_refresh: true # Auto-refresh session cookies
  refresh_interval: 600 # Refresh interval in seconds (Not less than 60s)
  auto_close: false # Automatically close Gemini session after inactivity
  close_delay: 900 # Inactivity delay in seconds before auto-closing (Not less than 30s)
  verbose: true # Enable verbose logging for Gemini requests
  extended_thinking: false # Enable Gemini extended thinking mode for message generation
  max_chars_per_request: 1000000 # Maximum characters Gemini Web accepts per request. Non-pro users might have a lower limit
  allow_private_url_fetch: false # Allow server-side fetching of private/loopback URLs (SSRF risk; default blocks them)
  url_fetch_timeout: 15 # Timeout in seconds for server-side URL fetches
  # What happens to the chats this server opens in the Google account:
  #   "normal"      - kept until you delete them.
  #   "temporary"   - never saved. Google may close a temporary chat at any time without an error, so a
  #                   reply can come back without the earlier context. The input limit is also lower.
  #   "auto_delete" - kept like "normal", then deleted from Google and from local storage once idle
  #                   for auto_delete_ttl. Only chats opened in this mode are ever deleted.
  chat_mode: "normal"
  auto_delete_ttl: 86400 # Idle seconds before an "auto_delete" chat is deleted (Not less than 60s)
  # Guest client health policy: "strict" fails if any client is unhealthy; "adaptive" fails only if all are unhealthy; "permissive" only logs a warning.
  guest_mode: "adaptive"
  # Send the system prompt at the start of a /v1/chat/completions or /v1/responses request as a
  # gem (saved custom instructions) in the Google account instead of inline. Guest sessions and
  # /v1beta requests always send it inline.
  # Google is retiring Gems (personal accounts: read-only from 2026-11-17, removed 2026-12-17;
  # Workspace: March 2027; education: June 2027), so this only works while the account has them.
  gems:
    #   "off"              - send system prompts inline.
    #   "fetch_only"       - use a gem that already exists for the prompt; never create one.
    #   "create_on_demand" - create a gem the first time a prompt is seen. This adds gems to the account.
    policy: "off"
    create_rate_limit_per_minute: 4  # Gems one client may create per minute
    managed_gems_max_total: 200      # Managed gems one client may hold
    policies:
      prefix: "fastapi_policy_"      # Name prefix that marks a gem as managed by this server
    # Deletes managed gems from the account at startup and every 6 hours, under either policy above.
    cleanup:
      enabled: false                 # Delete managed gems unused for `unused_days`
      unused_days: 7                 # Delete if not used for this many days
      touch_interval_minutes: 60     # Min minutes between last-use updates of one gem
      dry_run: false                 # If true, logs stale candidates without deleting
      max_deletes_per_run: 5         # Safety cap for deletions per account in one cleanup

storage:
  path: "data/lmdb" # Database storage path
  media_path: "data/media" # Media storage path
  max_size: 268435456 # Maximum database size (256 MB)
  # Days to keep conversations and media in local storage (0 keeps them forever). Local only: nothing is
  # deleted from the Google account. "auto_delete" chats follow gemini.auto_delete_ttl instead.
  retention_days: 14

logging:
  level: "DEBUG" # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
