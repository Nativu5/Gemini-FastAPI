name: Update gemini-webapi

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-gemini-webapi
  cancel-in-progress: true

jobs:
  update-dep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Update gemini-webapi
        id: update
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_RESOLUTION=$(uv tree --locked --package gemini-webapi --depth 0 | head -n 1)
          if [ -z "$CURRENT_RESOLUTION" ]; then
            echo "Error: Could not read the current gemini-webapi resolution" >&2
            exit 1
          fi
          echo "Current resolution: $CURRENT_RESOLUTION"

          uv lock --upgrade-package gemini-webapi

          UPDATED_RESOLUTION=$(uv tree --locked --package gemini-webapi --depth 0 | head -n 1)
          if [ -z "$UPDATED_RESOLUTION" ]; then
            echo "Error: Could not read the updated gemini-webapi resolution" >&2
            exit 1
          fi
          echo "Updated resolution: $UPDATED_RESOLUTION"

          if git diff --quiet -- uv.lock; then
            echo "No gemini-webapi version or Git revision updates are available"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "The gemini-webapi locked resolution has changed"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "resolution=$UPDATED_RESOLUTION" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ":arrow_up: update gemini-webapi dependency"
          title: ":arrow_up: update gemini-webapi dependency"
          body: |
            Refresh the locked `gemini-webapi` dependency.

            Resolved package: `${{ steps.update.outputs.resolution }}`.

            This tracks both compatible package releases and new commits on a configured Git branch.

            Auto-generated by GitHub Actions using `uv`.
          branch: update-gemini-webapi
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          labels: dependency, automated
          add-paths: uv.lock
